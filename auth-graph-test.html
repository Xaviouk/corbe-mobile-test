<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CORBÉ 49 — Test Microsoft Graph</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #202c39; }
    h1 { color: #e30613; font-size: 1.5rem; }
    button { padding: 10px 14px; margin: 8px 8px 8px 0; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f4f4; padding: 12px; border-radius: 6px; }
    .note { background: #fff3cd; border-left: 4px solid #e30613; padding: 10px 12px; }
  </style>
  <script>
    window.msalLoadError = null;
    window.msalLoaded = false;
  </script>
  <script src="https://alcdn.msauth.net/browser/4.26.0/js/msal-browser.min.js"
          onload="window.msalLoaded = !!window.msal"
          onerror="window.msalLoadError = 'Impossible de charger MSAL depuis le CDN Microsoft.'"></script>
</head>
<body>
  <h1>Test d’authentification CORBÉ 49</h1>
  <p>Page de test indépendante : elle ne modifie pas la signature Outlook.</p>
  <div class="note">
    URI de redirection attendue : <code>https://xaviouk.github.io/corbe-mobile-test/auth-graph-test.html</code>
  </div>
  <p><button id="login">Se connecter à Microsoft</button><button id="logout" disabled>Se déconnecter</button></p>
  <h2>Résultat</h2>
  <pre id="status">Vérification du chargement de MSAL…</pre>
  <script>
    const CLIENT_ID = "11d4d023-0187-483e-aa31-9b3f55153aee";
    const TENANT_ID = "75b354dc-0810-4caa-90a3-ac64ef88c77a";
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const statusBox = document.getElementById("status");
    const loginButton = document.getElementById("login");
    const logoutButton = document.getElementById("logout");
    let msalInstance = null;
    let ready = false;

    function show(value) {
      statusBox.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    async function loadProfile(account) {
      const tokenResult = await msalInstance.acquireTokenSilent({
        account,
        scopes: ["User.Read"]
      });
      const response = await fetch("https://graph.microsoft.com/v1.0/me?$select=displayName,mail,userPrincipalName,jobTitle,businessPhones,mobilePhone", {
        headers: { Authorization: "Bearer " + tokenResult.accessToken }
      });
      if (!response.ok) {
        const details = await response.text();
        throw new Error("Microsoft Graph a répondu " + response.status + " : " + details);
      }
      const profile = await response.json();
      show({
        status: "Connexion et appel Graph réussis",
        redirectUri: REDIRECT_URI,
        displayName: profile.displayName || "",
        email: profile.mail || profile.userPrincipalName || "",
        jobTitle: profile.jobTitle || "(poste non renseigné dans Microsoft 365)",
        businessPhones: profile.businessPhones || [],
        mobilePhone: profile.mobilePhone || "(mobile non renseigné dans Microsoft 365)"
      });
      loginButton.disabled = true;
      logoutButton.disabled = false;
    }

    async function start() {
      if (!window.msal || !window.msal.PublicClientApplication) {
        show("ERREUR : la bibliothèque MSAL n’a pas été chargée." +
          "\n" + (window.msalLoadError || "Le script CDN n’a pas créé l’objet window.msal.") +
          "\n\nVérifie la connexion Internet, le bloqueur de contenu ou le chargement du CDN Microsoft.");
        loginButton.disabled = true;
        return;
      }
      try {
        msalInstance = new window.msal.PublicClientApplication({
          auth: {
            clientId: CLIENT_ID,
            authority: "https://login.microsoftonline.com/" + TENANT_ID,
            redirectUri: REDIRECT_URI
          },
          cache: { cacheLocation: "sessionStorage" }
        });
        await msalInstance.initialize();
        ready = true;
        const redirectResult = await msalInstance.handleRedirectPromise();
        const accounts = msalInstance.getAllAccounts();
        const account = (redirectResult && redirectResult.account) || accounts[0];
        if (account) await loadProfile(account);
        else show("MSAL chargé. Prêt à lancer la connexion.\nURI : " + REDIRECT_URI);
      } catch (error) {
        show("Erreur au démarrage : " + (error && error.message ? error.message : String(error)));
      }
    }

    loginButton.addEventListener("click", async () => {
      if (!ready || !msalInstance) {
        show("Connexion impossible : MSAL n’est pas prêt. Recharge la page avec Ctrl+F5 et vérifie le résultat ci-dessus.");
        return;
      }
      try {
        show("Redirection vers Microsoft en cours…");
        await msalInstance.loginRedirect({ scopes: ["User.Read"] });
      } catch (error) {
        show("Erreur de connexion : " + (error && error.message ? error.message : String(error)));
      }
    });

    logoutButton.addEventListener("click", async () => {
      try {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        await msalInstance.logoutRedirect({ account, postLogoutRedirectUri: REDIRECT_URI });
      } catch (error) {
        show("Erreur de déconnexion : " + (error && error.message ? error.message : String(error)));
      }
    });

    start();
  </script>
</body>
</html>
